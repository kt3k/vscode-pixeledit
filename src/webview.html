<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="${tailwindUri}" />
    <style>
      .crisp-edges {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div class="flex mt-2">
      <span class="bg-gray-500 rounded p-2">
        <canvas class="js-mini-canvas crisp-edges"></canvas>
      </span>
    </div>
    <div class="preview mt-2 flex gap-4 p-2 bg-gray-500 rounded"></div>
    <div class="mt-4 flex items-start gap-4">
      <div class="flex flex-col gap-4">
        <div class="js-tools grid grid-cols-2"></div>
        <div class="js-palette grid grid-cols-2"></div>
      </div>
      <div class="relative w-3/4 max-w-[550px]">
        <canvas
          class="js-canvas-background absolute w-full crisp-edges"
        ></canvas>
        <canvas
          class="js-canvas absolute w-full cursor-crosshair crisp-edges"
        ></canvas>
      </div>
    </div>
  </body>
  <script src="${scriptUri}" type="module"></script>
</html>
